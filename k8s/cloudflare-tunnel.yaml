# Cloudflare Tunnel Deployment for exposing video-recorder
# Prerequisites:
# 1. Create a Cloudflare Tunnel in the Zero Trust Dashboard
# 2. Get the tunnel token from: Zero Trust > Access > Tunnels > Create Tunnel
# 3. Create the secret: kubectl create secret generic cloudflare-tunnel-token -n video-recorder --from-literal=token=<YOUR_TUNNEL_TOKEN>

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflare-tunnel-config
  namespace: video-recorder
data:
  config.yaml: |
    # Cloudflare Tunnel configuration
    tunnel: video-recorder-tunnel
    credentials-file: /etc/cloudflared/creds/credentials.json
    
    ingress:
      # Route traffic to video-recorder service
      - hostname: recorder.yourdomain.com  # REPLACE WITH YOUR DOMAIN
        service: http://video-recorder.video-recorder.svc.cluster.local:80
        originRequest:
          noTLSVerify: true
      # Catch-all rule (required)
      - service: http_status:404

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-tunnel
  namespace: video-recorder
  labels:
    app: cloudflare-tunnel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflare-tunnel
  template:
    metadata:
      labels:
        app: cloudflare-tunnel
    spec:
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:latest
        args:
          - tunnel
          - --no-autoupdate
          - --metrics
          - 0.0.0.0:2000
          - run
          - --token
          - $(TUNNEL_TOKEN)
        env:
        - name: TUNNEL_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflare-tunnel-token
              key: token
        resources:
          requests:
            memory: "64Mi"
            cpu: "10m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /ready
            port: 2000
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 2000
          initialDelaySeconds: 5
          periodSeconds: 5
      restartPolicy: Always
