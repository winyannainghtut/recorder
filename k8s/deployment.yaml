apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-recorder
  namespace: video-recorder
  labels:
    app: video-recorder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: video-recorder
  template:
    metadata:
      labels:
        app: video-recorder
    spec:
      # Security context for pod
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532

      containers:
      - name: recorder
        image: winyannainghtut/recorder:latest
        imagePullPolicy: Always

        # Environment variables
        env:
        - name: LOGIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: recorder-auth
              key: login-password

        # Resource limits - increased for large file handling
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"

        ports:
        - containerPort: 8080
          name: http
          protocol: TCP

        # Liveness probe
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 30
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3

        # Readiness probe
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 3
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3

        # Security context for container
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false  # False because we need /tmp write access
          capabilities:
            drop:
            - ALL

        # Volume mounts
        volumeMounts:
        - name: tmp-videos
          mountPath: /tmp/videos

      # Volumes
      volumes:
      - name: tmp-videos
        emptyDir:
          sizeLimit: "5Gi"  # Increased for 3-hour recordings (up to 2GB each)
