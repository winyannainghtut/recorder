<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Screen Recorder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --surface: #f5f5f5;
            --surface-strong: #ffffff;
            --ink: #111111;
            --muted: #666666;
            --line: #dddddd;
            --line-strong: #111111;
            --primary: #174cff;
            --primary-hover: #0d36bd;
            --danger: #d7261e;
            --focus: #ffb000;
        }

        body {
            min-width: 980px;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background:
                linear-gradient(var(--line) 1px, transparent 1px),
                linear-gradient(90deg, var(--line) 1px, transparent 1px),
                var(--surface);
            background-size: 48px 48px;
            color: var(--ink);
            font-family: Arial, Helvetica, sans-serif;
            font-size: 16px;
            line-height: 1.5;
            padding: 24px;
        }

        button,
        input {
            font: inherit;
        }

        button:focus-visible,
        input:focus-visible {
            outline: 3px solid var(--focus);
            outline-offset: 3px;
        }

        .login-shell {
            width: 920px;
            display: grid;
            grid-template-columns: minmax(280px, 1fr) minmax(320px, 420px);
            background: var(--surface-strong);
            border: 2px solid var(--line-strong);
        }

        .login-copy {
            min-height: 520px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 28px;
            border-right: 2px solid var(--line-strong);
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 0.875rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .brand-mark {
            width: 18px;
            height: 18px;
            background: var(--primary);
            display: inline-block;
        }

        .login-copy h1 {
            max-width: 520px;
            font-size: 5.5rem;
            font-weight: 700;
            line-height: 0.92;
        }

        .login-copy p {
            max-width: 420px;
            color: var(--muted);
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .login-panel {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 28px;
        }

        .login-panel h2 {
            font-size: 1.75rem;
            line-height: 1.1;
            margin-bottom: 8px;
        }

        .login-panel .subtitle {
            color: var(--muted);
            font-size: 0.875rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.875rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .form-group input {
            width: 100%;
            min-height: 50px;
            padding: 12px;
            background: var(--surface-strong);
            border: 2px solid var(--line-strong);
            border-radius: 0;
            color: var(--ink);
            font-size: 1rem;
        }

        .form-group input::placeholder {
            color: var(--muted);
        }

        .btn {
            width: 100%;
            min-height: 50px;
            border: 2px solid var(--primary);
            border-radius: 0;
            background: var(--primary);
            color: #ffffff;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 700;
            text-transform: uppercase;
            transition: background 160ms ease, border-color 160ms ease;
        }

        .btn:hover:not(:disabled) {
            background: var(--primary-hover);
            border-color: var(--primary-hover);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error-message {
            display: none;
            margin-bottom: 18px;
            border: 2px solid var(--danger);
            color: var(--danger);
            padding: 10px 12px;
            font-size: 0.875rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .error-message.show {
            display: block;
        }

        .loading {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .loading.show {
            display: flex;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 800ms linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn-text {
            display: block;
        }

        .btn-text.hidden {
            display: none;
        }

    </style>
</head>
<body>
    <main class="login-shell">
        <section class="login-copy" aria-labelledby="loginTitle">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true"></span>
                <span>Screen Recorder</span>
            </div>
            <h1 id="loginTitle">Private recorder.</h1>
            <p>Local downloads. Mixed audio.</p>
        </section>

        <section class="login-panel" aria-label="Sign in">
            <h2>Sign in</h2>
            <p class="subtitle">Protected access</p>

            <div id="errorMessage" class="error-message">
                Invalid password. Please try again.
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        required
                        autocomplete="current-password"
                    >
                </div>

                <button type="submit" class="btn" id="loginBtn">
                    <span class="btn-text" id="btnText">Sign In</span>
                    <span class="loading" id="btnLoading">
                        <span class="spinner"></span>
                        <span>Signing in</span>
                    </span>
                </button>
            </form>
        </section>
    </main>

    <script>
        const form = document.getElementById('loginForm');
        const passwordInput = document.getElementById('password');
        const errorMessage = document.getElementById('errorMessage');
        const loginBtn = document.getElementById('loginBtn');
        const btnText = document.getElementById('btnText');
        const btnLoading = document.getElementById('btnLoading');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            errorMessage.classList.remove('show');
            btnText.classList.add('hidden');
            btnLoading.classList.add('show');
            loginBtn.disabled = true;

            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        password: passwordInput.value
                    })
                });

                if (response.ok) {
                    window.location.href = '/';
                } else {
                    errorMessage.classList.add('show');
                    passwordInput.value = '';
                    passwordInput.focus();
                }
            } catch (error) {
                console.error('Login error:', error);
                errorMessage.textContent = 'Connection error. Please try again.';
                errorMessage.classList.add('show');
            } finally {
                btnText.classList.remove('hidden');
                btnLoading.classList.remove('show');
                loginBtn.disabled = false;
            }
        });

        passwordInput.focus();
    </script>
</body>
</html>
